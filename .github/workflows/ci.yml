name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax checks
        run: |
          node --check server.js
          python3 -m py_compile build_data.py

      - name: Secret scan
        run: |
          ! git grep -lIE "sk-or-v1-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA|OPENSSH) PRIVATE KEY-----" -- .

      - name: Unit tests
        run: node --test test/game.test.js

      - name: Smoke test (boots server, plays a drive)
        run: bash scripts/smoke.sh
